name: terraform-clase11

on:
  pull_request:
    branches: [develop]
    paths: ["clase11/**", ".github/workflows/terraform.yml"]
  push:
    branches: [develop]
    paths: ["clase11/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        type: choice
        options: [apply, destroy]
        default: apply
      confirm:
        description: "Para destroy escribí DESTROY"
        type: string
        required: false

permissions:
  id-token: write
  contents: read

# Una sola ejecución a la vez: evita pelear por el bloqueo del estado
concurrency:
  group: terraform-clase11
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_bucket_name: ${{ vars.LAB_BUCKET_NAME }}
  TF_VAR_http_cidr: ${{ vars.LAB_HTTP_CIDR }}

defaults:
  run:
    working-directory: clase11/infra

jobs:
  # Pull request: solo comprueba formato y sintaxis, sin credenciales de AWS
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init (sin backend)
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  # Ejecución manual de destroy sin la palabra de confirmación: falla a propósito
  confirmacion:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && inputs.confirm != 'DESTROY'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Para destruir hay que escribir DESTROY en el campo confirm."
          exit 1

  # Push a develop o ejecución manual: autentica con OIDC, plan y apply/destroy
  terraform:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.action == 'apply' ||
        (inputs.action == 'destroy' && inputs.confirm == 'DESTROY')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - name: Credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=lab-iac-dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
      - name: Terraform plan
        if: inputs.action != 'destroy'
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        if: inputs.action != 'destroy'
        run: terraform apply -input=false tfplan
      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
