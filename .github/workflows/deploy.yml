name: CI y Deploy

on:
  pull_request:
    branches: [develop_Correa]
  push:
    branches: [develop_Correa]
  workflow_dispatch:
    inputs:
      action:
        description: "Qué hacer con la infraestructura"
        type: choice
        options: [deploy, destroy]
        default: deploy

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::058264073348:role/github-deploy-clase10
  TF_DIR: clase10/infra

concurrency:
  group: infra-clase10
  cancel-in-progress: false

jobs:
  ci:
    name: Validar y construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform fmt y validate (sin credenciales)
        run: |
          terraform -chdir=$TF_DIR fmt -check -recursive
          terraform -chdir=$TF_DIR init -backend=false
          terraform -chdir=$TF_DIR validate

      - name: Validar plantilla HTML
        run: grep -q "__COMMIT_SHA__" clase10/site/index.template.html

      - name: Construir HTML
        run: |
          mkdir -p dist
          sed "s/__COMMIT_SHA__/${GITHUB_SHA}/g; s/__BUILD_DATE__/$(date -u +%FT%TZ)/g" \
            clase10/site/index.template.html > dist/index.html
          grep -q "${GITHUB_SHA}" dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/index.html

  deploy:
    name: Desplegar
    needs: ci
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform apply
        run: |
          terraform -chdir=$TF_DIR init
          terraform -chdir=$TF_DIR apply -auto-approve

      - name: Leer outputs
        run: |
          echo "INSTANCE_ID=$(terraform -chdir=$TF_DIR output -raw instance_id)" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$(terraform -chdir=$TF_DIR output -raw public_ip)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Esperar a que la instancia esté en SSM
        run: |
          for i in $(seq 1 30); do
            S=$(aws ssm describe-instance-information \
              --filters Key=InstanceIds,Values=$INSTANCE_ID \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            echo "SSM: $S"
            [ "$S" = "Online" ] && exit 0
            sleep 10
          done
          echo "La instancia no quedó Online en SSM"; exit 1

      - name: Publicar en Nginx con SSM Run Command
        run: |
          B64=$(base64 -w0 dist/index.html)
          PARAMS=$(jq -n --arg b64 "$B64" '{commands: [
            "for i in $(seq 1 24); do [ -d /usr/share/nginx/html ] && break; sleep 5; done",
            ("echo " + $b64 + " | base64 -d > /usr/share/nginx/html/index.html"),
            "systemctl restart nginx"
          ]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || {
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
            exit 1
          }

      - name: Verificar por HTTP el commit desplegado
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://$PUBLIC_IP" | grep -q "$GITHUB_SHA"; then
              echo "OK: la página contiene el commit $GITHUB_SHA"; exit 0
            fi
            sleep 5
          done
          echo "La página no contiene el commit esperado"; exit 1

  destroy:
    name: Destruir infraestructura
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - run: |
          terraform -chdir=$TF_DIR init
          terraform -chdir=$TF_DIR destroy -auto-approve
